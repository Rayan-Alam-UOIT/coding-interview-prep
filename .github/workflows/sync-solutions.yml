
name: Sync LeetCode and NeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-coding-solutions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout central repository
        uses: actions/checkout@v4
        with:
          path: central

      - name: Checkout LeetCode repository
        uses: actions/checkout@v4
        with:
          repository: Rayan-Alam-UOIT/leetcode-solutions
          path: leetcode
          persist-credentials: false

      - name: Checkout NeetCode repository
        uses: actions/checkout@v4
        with:
          repository: Rayan-Alam-UOIT/neetcode-submissions
          path: neetcode
          persist-credentials: false

      - name: Sync LeetCode solutions
        run: |
          mkdir -p central/LeetCode

          rsync -av --delete \
            leetcode/solutions/ \
            central/LeetCode/

      - name: Sync NeetCode solutions
        run: |
          mkdir -p central/NeetCode

          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            neetcode/ \
            central/NeetCode/

      - name: Commit changes
        working-directory: central
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A LeetCode/ NeetCode/

          if git diff --cached --quiet; then
            echo "No new solutions to sync."
            exit 0
          fi

          git commit -m "chore: sync coding solutions"
          git push
