
name: Sync LeetCode and NeetCode

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-coding-solutions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout central repository
        uses: actions/checkout@v4
        with:
          path: central

      - name: Checkout LeetCode repository
        uses: actions/checkout@v4
        with:
          repository: Rayan-Alam-UOIT/leetcode-solutions
          path: leetcode
          persist-credentials: false

      - name: Checkout NeetCode repository
        uses: actions/checkout@v4
        with:
          repository: Rayan-Alam-UOIT/neetcode-submissions
          path: neetcode
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync LeetCode solutions
        run: |
          mkdir -p central/LeetCode

          rsync -av --delete \
            leetcode/solutions/ \
            central/LeetCode/

      - name: Sync NeetCode solutions
        run: |
          mkdir -p central/NeetCode

          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            neetcode/ \
            central/NeetCode/

      - name: Update statistics dashboard
        working-directory: central
        run: |
          if ! git diff --quiet -- LeetCode/ NeetCode/ ||
             grep -q "Statistics will appear" README.md; then
            python scripts/update_stats.py
          else
            echo "No new solutions. Dashboard unchanged."
          fi

      - name: Commit and push changes
        working-directory: central
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A LeetCode/ NeetCode/ README.md

          if git diff --cached --quiet; then
            echo "Everything is up to date."
            exit 0
          fi

          git commit -m "chore: sync solutions and update dashboard"
          git push
